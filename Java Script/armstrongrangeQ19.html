<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let lowernum = Number(prompt("enter the lower value:"));
        let uppernum = Number(prompt("enter the upper value:"));
        for(let i=lowernum;i<=uppernum;i++){
            let numberOfDigits = i.toString().length;
            let temp=i;
            let sum=0;
            while(temp>0){
                let reminder = temp%10;
                sum+= reminder** numberOfDigits;
                temp=parseInt(temp/10);
            }
            if(sum==i){
                console.log(i);
            }
        }
    </script>
</body>
</html>
