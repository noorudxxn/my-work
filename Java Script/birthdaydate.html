<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday Date</title>
  </head>
  <body>
    <script>
     let friend = {
    name: "John",
    birthDate: "1999-07-05"
};

function getBirthdayDetails(friend) {
    let birth = new Date(friend.birthDate);
    let year = birth.getFullYear();
    let day = birth.getDate();
    let monthName = birth.toLocaleString("en-US", {
        month: "long"
    });
    let today = new Date();
    let age = today.getFullYear() - year;
    console.log(
        `${friend.name} was born on ${day} ${monthName}, ${year} and is ${age} years old.`
    );
}

getBirthdayDetails(friend);
    </script>
  </body>
</html>
