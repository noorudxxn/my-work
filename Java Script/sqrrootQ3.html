<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="sqr"></p>
    <script>
        let inpt1 = Number(prompt("enter the number"));
        for(let i=1;i<=inpt1;i++){
            if(i*i == inpt1){
                document.getElementById("sqr").innerHTML="Square root : " + i;
                break;

            }
        }
    </script>
</body>
</html>
