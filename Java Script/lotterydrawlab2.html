<!DOCTYPE html>
<html>
<head>
    <title>Lottery Draw</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Lottery Draw</h2>
        <button class="btn btn-primary" onclick="drawWinner()">Select Winner</button>
        <h3 id="winner" style="color:red;"></h3>

    </div>
    
    <div class="modal fade" id="winnerModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Lottery Winner</h5>
                </div>

                <div class="modal-body">
                    <h3 id="modalWinner"></h3>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let lotteryNumbers = [101, 205, 307, 412, 523, 634, 745];
            function drawWinner() {
            let randomIndex = Math.floor(Math.random() * lotteryNumbers.length);
            let winner = lotteryNumbers[randomIndex];
            console.log("Lottery Winner:", winner);
            document.getElementById("winner").innerHTML =
                "Winner: " + winner;
            document.getElementById("modalWinner").innerHTML =
                "🎉 Winning Number: " + winner;
            let modal = new bootstrap.Modal(
                document.getElementById("winnerModal")
            );
            modal.show();
        }
    </script>
</body>
</html>
