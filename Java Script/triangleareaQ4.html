<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="heights"></p>
    <p id="bases"></p>
    <p id="areas"></p>
    <script>
         let height = Number(prompt("enter the height :")) ;
        let base = Number(prompt("enter the base :")) ;
        let area = 0.5 * base * height;
        document.getElementById("heights").innerHTML = height;
        document.getElementById("bases").innerHTML = base;
        document.getElementById("areas").innerHTML = area;
    </script>
</body>
</html>
