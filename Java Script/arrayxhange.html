<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let arr = [3, 0, 7, 0, 5];

      for (let i = 0; i < arr.length; i++) {
        if (arr[i] == 0) {
          for (let j = i; j < arr.length - 1; j++) {
            arr[j] = arr[j + 1];
          }

          arr[arr.length - 1] = 0;
        }
      }

      console.log(arr);
    </script>
  </body>
</html>
