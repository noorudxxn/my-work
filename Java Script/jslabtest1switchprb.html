<!doctype html>
<html>
  <head>
    <title>Calculator</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div class="container mt-5">
      <div class="card shadow p-4 mx-auto" style="max-width: 500px">
        <h2 class="text-center mb-4">Simple Calculator</h2>
        <input
          type="text"
          id="num1"
          class="form-control mb-3"
          placeholder="Enter first number"
        />
        <select id="operator" class="form-control mb-3">
          <option value="+">Addition (+)</option>
          <option value="-">Subtraction (-)</option>
          <option value="*">Multiplication (*)</option>
          <option value="/">Division (/)</option>
        </select>
        <input
          type="text"
          id="num2"
          class="form-control mb-3"
          placeholder="Enter second number"
        />
        <button onclick="calculate()" class="btn btn-primary btn-block">
          =
        </button>
        <p id="result" class="text-center mt-4 font-weight-bold"></p>
      </div>
    </div>
    <script>
      function add(a, b) {
        return a + b;
      }
      function subtract(a, b) {
        return a - b;
      }
      function multiply(a, b) {
        return a * b;
      }
      function divide(a, b) {
        return a / b;
      }
      function print(result) {
        if (result === Infinity) {
          document.getElementById("result").innerHTML =
            "Can't be divided by zero";
        } else if (isNaN(result)) {
          document.getElementById("result").innerHTML =
            "Pleasee enter valid numbers";
        } else {
          document.getElementById("result").innerHTML =
            "Result: " + result.toFixed(2);
        }
      }
      function calculate() {
        let num1 = document.getElementById("num1").value;
        let num2 = document.getElementById("num2").value;
        if (isNaN(num1) || isNaN(num2)) {
          document.getElementById("result").innerHTML =
            "please enter numbers only";
          return;
        }
        if (num1 == "" || num2 == "") {
        document.getElementById("result").innerHTML =
            "Please give an input";
        return;
    }
        num1 = Number(num1);
        num2 = Number(num2);

        let operator = document.getElementById("operator").value;
        let result;
        switch (operator) {
          case "+":
            result = add(num1, num2);
            break;

          case "-":
            result = subtract(num1, num2);
            break;

          case "*":
            result = multiply(num1, num2);
            break;

          case "/":
            result = divide(num1, num2);
            break;

          default:
            result = NaN;
        }
        print(result);
      }
    </script>
  </body>
</html>
